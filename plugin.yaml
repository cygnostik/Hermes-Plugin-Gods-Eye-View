manifest_version: 1
name: gods-eye-view
version: "0.1.2"
requires_hermes: ">=0.21.5"
description: Community God's Eye View integration for Hermes Desktop — native globe, Focus mode, and explicit local engine controls.
author: "Chris M. / ProDyn.ai"
license: MIT
homepage: https://github.com/cygnostik/Hermes-Plugin-Gods-Eye-View
tags: [desktop, geospatial, cesium, unofficial]
python_dependencies:
  - "httpx>=0.27,<1"
  - "fastapi>=0.115,<1"
  # Desktop targets retain their bounded index dependency. Android is not a
  # supported Desktop target and Hermes pins its own psutil source there.
  - "psutil>=5.9,<8; sys_platform != 'android'"
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
